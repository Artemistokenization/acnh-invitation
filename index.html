<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#60bafa" />
    <title>曾嘉慧 ♥ 陆峰浩 · 邀请你登岛</title>
    <meta name="description" content="卡通欢乐岛婚礼请柬 · 10月3日 浙江嘉兴" />
    <!-- 微信 / QQ 分享卡片：聊天里粘贴只有文字链接，需在本页右上角「···」→「发送给朋友」才生成卡片 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="卡通欢乐岛" />
    <meta property="og:title" content="曾嘉慧 ♥ 陆峰浩 · 邀请你登岛" />
    <meta property="og:description" content="卡通欢乐岛婚礼请柬 · 10月3日 浙江嘉兴" />
    <meta property="og:url" content="https://artemistokenization.github.io/acnh-invitation/" />
    <meta property="og:image" content="https://artemistokenization.github.io/acnh-invitation/share.jpg" />
    <meta property="mp:title" content="曾嘉慧 ♥ 陆峰浩 · 邀请你登岛" />
    <meta property="mp:desc" content="卡通欢乐岛婚礼请柬 · 10月3日 浙江嘉兴" />
    <meta property="mp:image:" content="https://artemistokenization.github.io/acnh-invitation/share.jpg" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css?v=28" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="switch-group">
          <button class="pill on" id="btn-sound" aria-pressed="true">♪ 声音 <b>开</b></button>
        </div>
        <button class="pill pill-jump" id="btn-direct">直接查看邀请函 <i>↗</i></button>
      </header>

      <main class="scenes">
        <!-- 场景一：气球礼物 -->
        <section class="scene scene-arrival active" id="scene-arrival">
          <div class="clouds">
            <span class="cloud c1"></span><span class="cloud c2"></span>
            <span class="cloud c3"></span><span class="cloud c4"></span>
            <span class="cloud c5"></span><span class="cloud c6"></span>
          </div>
          <div class="arrival-head">
            <h1 id="island-name">卡通欢乐岛</h1>
            <p>A LITTLE SURPRISE FOR YOU</p>
          </div>
          <div class="sky-stage" id="sky-stage">
          <div class="island-strip" aria-hidden="true">
            <svg viewBox="0 0 430 150" preserveAspectRatio="none">
              <rect y="96" width="430" height="26" fill="#7fd0ee" />
              <rect y="118" width="430" height="32" fill="#6fb94f" />
              <path d="M0 126 q107 -26 215 -26 q108 0 215 26 v24 H0z" fill="#7cc75c" />
              <rect y="100" width="430" height="8" fill="#9ad877" />
              <g transform="translate(52 0)">
                <rect x="-7" y="72" width="14" height="46" fill="#9c6530" />
                <g fill="#57a844"><ellipse cx="0" cy="46" rx="52" ry="34" /><ellipse cx="-30" cy="62" rx="30" ry="24" /><ellipse cx="30" cy="62" rx="30" ry="24" /></g>
                <g fill="#6dbd52"><ellipse cx="-16" cy="36" rx="30" ry="22" /><ellipse cx="20" cy="40" rx="26" ry="20" /></g>
                <g fill="#84cd67"><ellipse cx="-24" cy="54" rx="20" ry="14" /><ellipse cx="14" cy="58" rx="18" ry="13" /></g>
              </g>
              <g transform="translate(378 0)">
                <rect x="-7" y="76" width="14" height="44" fill="#9c6530" />
                <g fill="#57a844"><ellipse cx="0" cy="50" rx="54" ry="36" /><ellipse cx="-32" cy="66" rx="30" ry="24" /><ellipse cx="32" cy="66" rx="30" ry="24" /></g>
                <g fill="#6dbd52"><ellipse cx="16" cy="40" rx="30" ry="22" /><ellipse cx="-20" cy="44" rx="26" ry="20" /></g>
                <g fill="#84cd67"><ellipse cx="24" cy="58" rx="20" ry="14" /><ellipse cx="-14" cy="62" rx="18" ry="13" /></g>
              </g>
              <g fill="#63b951">
                <ellipse cx="150" cy="122" rx="26" ry="14" /><ellipse cx="250" cy="124" rx="22" ry="12" /><ellipse cx="316" cy="120" rx="18" ry="11" />
              </g>
            </svg>
          </div>
            <i class="ground" id="ground"></i>

            <!-- 气球吊着礼盒，整组随风轻摆 -->
            <div class="rig" id="rig">
              <div class="balloon" id="balloon">
                <svg viewBox="0 0 120 132" aria-hidden="true">
                  <defs>
                    <radialGradient id="g-ball" cx="0.36" cy="0.28" r="0.85">
                      <stop offset="0" stop-color="#f8836f" />
                      <stop offset="0.45" stop-color="#e8493a" />
                      <stop offset="1" stop-color="#c22c1c" />
                    </radialGradient>
                  </defs>
                  <ellipse cx="60" cy="58" rx="55" ry="62" fill="url(#g-ball)" />
                  <ellipse cx="38" cy="32" rx="14" ry="21" fill="#fff" opacity="0.34" transform="rotate(-24 38 32)" />
                  <path d="M60 118 l-9 14 h18 z" fill="#c22c1c" />
                </svg>
              </div>
              <i class="tether" id="tether"></i>
              <div class="gift" id="gift">
                <svg class="gift-body" viewBox="0 0 120 104" aria-hidden="true">
                  <rect x="14" y="26" width="92" height="74" rx="7" fill="#f7f0dd" />
                  <path d="M76 26 h30 v74 h-30 z" fill="#e9dfc4" opacity="0.55" />
                  <rect x="51" y="26" width="18" height="74" fill="#e8564b" />
                </svg>
                <div class="gift-lid" id="gift-lid">
                  <svg viewBox="0 0 120 62" aria-hidden="true">
                    <rect x="8" y="22" width="104" height="24" rx="6" fill="#faf5e6" />
                    <rect x="8" y="40" width="104" height="6" fill="#e9dfc4" />
                    <rect x="51" y="22" width="18" height="24" fill="#e8564b" />
                    <g fill="none" stroke="#e8564b" stroke-width="9" stroke-linecap="round">
                      <ellipse cx="40" cy="14" rx="15" ry="13" />
                      <ellipse cx="80" cy="13" rx="19" ry="16" transform="rotate(-14 80 13)" />
                    </g>
                    <rect x="50" y="8" width="20" height="14" rx="6" fill="#e8564b" />
                  </svg>
                </div>
                <div class="invite" id="invite">
                  <svg viewBox="0 0 200 132" aria-hidden="true">
                    <rect width="200" height="132" rx="7" fill="#f3e7cd" />
                    <path d="M0 7 q100 78 200 0 v118 H0z" fill="#e6d5ae" opacity="0.6" />
                    <path d="M0 7 L100 85 L200 7" fill="none" stroke="#cdbb8e" stroke-width="4" />
                    <g transform="translate(100 92)">
                      <circle r="21" fill="#3f9d78" />
                      <path d="M0 -12 q12 7 9 17 q-9 7 -18 0 q-3 -10 9 -17z" fill="#eaf6ef" />
                      <path d="M0 -9 v18" stroke="#3f9d78" stroke-width="2.6" />
                    </g>
                  </svg>
                </div>
              </div>
            </div>

            <!-- 动森弹弓 -->
            <div class="sling" id="sling">
              <svg viewBox="0 0 120 132" aria-hidden="true">
                <g fill="none" stroke-linecap="round">
                  <path d="M34 20 C34 62 44 78 60 86 C76 78 86 62 86 20" stroke="#6a4630" stroke-width="26" />
                  <path d="M60 86 V122" stroke="#6a4630" stroke-width="24" />
                  <path d="M34 20 C34 62 44 78 60 86 C76 78 86 62 86 20" stroke="#c39557" stroke-width="14" />
                  <path d="M60 88 V122" stroke="#c39557" stroke-width="12" />
                </g>
                <g id="bands" stroke="#cc5f42" stroke-width="7" stroke-linecap="round" fill="none">
                  <path d="M40 30 L60 76" />
                  <path d="M80 30 L60 76" />
                </g>
                <rect x="43" y="68" width="34" height="14" rx="7" fill="#5d3f2b" />
              </svg>
            </div>

            <i class="pebble" id="pebble"></i>
            <div class="fx" id="fx" aria-hidden="true"></div>
            <i class="flash" id="flash"></i>

          </div>
          <div class="bubble-slot">
            <div class="bubble" id="arrival-bubble">
              <p class="bubble-text" id="arrival-text"></p>
              <button class="cta cta-green" id="btn-open" hidden>打开看看 <i>→</i></button>
              <span class="next" id="arrival-next">▼</span>
            </div>
          </div>
          <p class="hint" id="arrival-hint">点击可以试试</p>
        </section>

        <!-- 狸克来信信封：开场 → 广播的转场 -->
        <div class="envelope-fly" id="envelope" aria-hidden="true">
          <svg viewBox="0 0 200 132">
            <rect width="200" height="132" rx="7" fill="#dfe9ee" />
            <path d="M0 7 q100 78 200 0 v118 H0z" fill="#cfdde5" opacity="0.75" />
            <path d="M0 7 L100 78 L200 7" fill="none" stroke="#bccdd7" stroke-width="3" />
            <g transform="translate(100 74)">
              <circle r="19" fill="#3f9d78" />
              <path d="M0 -11 q11 6 8 15 q-8 6 -16 0 q-3 -9 8 -15z" fill="#eaf6ef" />
              <path d="M0 -8 v16" stroke="#3f9d78" stroke-width="2.4" />
            </g>
          </svg>
        </div>

        <!-- 场景二：岛内广播 -->
        <section class="scene scene-broadcast" id="scene-broadcast">
          <div class="booth">
            <video class="character" id="character" src="cast.mp4?v=28" poster="poster.jpg?v=28" playsinline webkit-playsinline="true" x5-playsinline="" x5-video-player-type="h5-page" x5-video-player-fullscreen="false" preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate" aria-label="西施惠岛内广播（ACNH 游戏原生过场录像，原声播放）"></video>
            <span class="note-fx" id="note-fx">♪</span>
          </div>

          <div class="dialogue-slot">
            <span class="name-chip">西施惠</span>
            <div class="bubble bubble-lg" id="bcast-bubble">
              <p class="bubble-text" id="bcast-text"></p>
            </div>
          </div>
          <p class="caption" id="bcast-caption">卡通欢乐岛 · 特别广播</p>
          <div class="actions">
            <button class="pill" id="btn-pause"><b>暂停</b></button>
            <button class="pill pill-go" id="btn-skip">跳过广播，去收信 <i>→</i></button>
          </div>
        </section>

        <!-- 场景三：狸克邮件 / 邀请函正文 -->
        <section class="scene scene-letter" id="scene-letter">
          <article class="letter" id="letter-card">
            <div class="letter-stamp"><span>Nook Inc.</span><small>狸克 寄出</small></div>

            <p class="letter-kicker">卡通欢乐岛 · 婚礼请柬</p>
            <h2 class="letter-call">我们结婚啦！</h2>
            <p class="letter-body">
              诚邀你登上小岛，<br />
              见证我们交换约定的那一刻。
            </p>

            <div class="card card-info">
              <div class="info-row">
                <small>婚礼日期</small>
                <b id="w-date">10月3日</b>
              </div>
              <div class="info-row">
                <small>婚礼地点</small>
                <b id="w-place">浙江 · 嘉兴</b>
              </div>
              <p class="info-note">具体时间、仪式安排以新人的婚礼通知为准</p>
            </div>

            <div class="letter-seal">
              <span class="seal-leaf"></span>
              <p class="seal-names" id="w-names">曾嘉慧 ♥ 陆峰浩</p>
              <p class="seal-sub">卡通欢乐岛 · 等你登岛</p>
            </div>
          </article>
        </section>
      </main>
      <i class="iris" id="iris" aria-hidden="true"></i>
    </div>
    <script type="module" src="app.js?v=28"></script>
  </body>
</html>
