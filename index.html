<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#60bafa" />
    <title>一起登岛吧｜动森主题婚礼请柬</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="switch-group">
          <button class="pill" id="btn-music" aria-pressed="false">♪ 音乐 <b>关</b></button>
          <button class="pill on" id="btn-sfx" aria-pressed="true">音效 <b>开</b></button>
        </div>
        <button class="pill pill-jump" id="btn-direct">直接查看邀请函 <i>↗</i></button>
      </header>

      <main class="scenes">
        <!-- 场景一：气球礼物 -->
        <section class="scene scene-arrival active" id="scene-arrival">
          <div class="clouds">
            <span class="cloud c1"></span><span class="cloud c2"></span>
            <span class="cloud c3"></span><span class="cloud c4"></span>
          </div>
          <div class="arrival-head">
            <h1 id="island-name">卡通欢乐岛</h1>
            <p>A LITTLE SURPRISE FOR YOU</p>
          </div>
          <div class="balloon-rig" id="balloon-rig">
            <svg viewBox="0 0 200 300" aria-hidden="true">
              <ellipse cx="100" cy="92" rx="62" ry="72" fill="#e0402f" />
              <ellipse cx="78" cy="66" rx="16" ry="24" fill="#ffffff" opacity="0.32" />
              <path d="M100 164 l-11 16 h22 z" fill="#c8331f" />
              <path d="M100 180 q-16 22 0 34 q16 12 0 30" stroke="#f4e9cf" stroke-width="4" fill="none" />
              <g transform="translate(100 258)">
                <rect x="-42" y="-26" width="84" height="56" rx="7" fill="#f6efdd" />
                <rect x="-42" y="-8" width="84" height="16" fill="#e8564b" />
                <rect x="-9" y="-26" width="18" height="56" fill="#e8564b" />
                <path d="M-9 -26 q-24 -18 -30 -2 q-4 12 30 2z" fill="#e8564b" />
                <path d="M9 -26 q24 -18 30 -2 q4 12 -30 2z" fill="#e8564b" />
              </g>
            </svg>
          </div>
          <div class="island-strip" aria-hidden="true">
            <svg viewBox="0 0 430 120" preserveAspectRatio="none">
              <rect y="70" width="430" height="50" fill="#79c25a" />
              <rect y="70" width="430" height="9" fill="#8fd06e" />
              <g fill="#4faa46"><ellipse cx="42" cy="66" rx="46" ry="40" /><ellipse cx="392" cy="66" rx="48" ry="42" /></g>
              <g fill="#63b951"><ellipse cx="20" cy="58" rx="30" ry="26" /><ellipse cx="414" cy="56" rx="32" ry="28" /></g>
              <rect x="36" y="86" width="12" height="34" fill="#9c6530" />
              <rect x="382" y="86" width="12" height="34" fill="#9c6530" />
            </svg>
          </div>
          <div class="bubble-slot">
            <div class="bubble" id="arrival-bubble">
              <p class="bubble-text" id="arrival-text"></p>
              <span class="next" id="arrival-next">▼</span>
            </div>
          </div>
          <p class="hint" id="arrival-hint">点击可以试试</p>
          <button class="cta" id="btn-open" hidden>打开看看 <i>→</i></button>
        </section>

        <!-- 场景二：岛内广播 -->
        <section class="scene scene-broadcast" id="scene-broadcast">
          <div class="booth">
            <video class="character" id="character" src="cast.mp4" playsinline preload="auto" aria-label="西施惠岛内广播（ACNH 游戏原生过场录像，原声播放）"></video>
            <span class="note-fx" id="note-fx">♪</span>
          </div>

          <div class="dialogue-slot">
            <span class="name-chip">西施惠</span>
            <div class="bubble bubble-lg">
              <p class="bubble-text" id="bcast-text"></p>
            </div>
          </div>
          <p class="caption" id="bcast-caption">卡通欢乐岛 · 特别广播</p>
          <div class="actions">
            <button class="pill" id="btn-pause"><b>暂停</b></button>
            <button class="pill" id="btn-voice"><b>广播静音</b></button>
            <button class="pill pill-go" id="btn-skip">跳过广播，去收信 <i>→</i></button>
          </div>
        </section>

        <!-- 场景三：狸克邮件 / 邀请函正文 -->
        <section class="scene scene-letter" id="scene-letter">
          <article class="letter" id="letter-card">
            <div class="letter-stamp"><span>Nook Inc.</span><small>狸克 寄出</small></div>

            <p class="letter-kicker">卡通欢乐岛 · 婚礼请柬</p>
            <h2 class="letter-call">我们结婚啦！</h2>
            <p class="letter-body">
              诚邀你登上小岛，<br />
              见证我们交换约定的那一刻。
            </p>

            <div class="card card-place">
              <small>婚礼地点</small>
              <b id="w-place">浙江 · 嘉兴</b>
            </div>

            <div class="card card-quiet">
              <b>具体日期 · 时间 · 仪式安排</b>
              <span>以新人的婚礼通知为准</span>
            </div>

            <div class="letter-seal">
              <span class="seal-leaf"></span>
              <p class="seal-names" id="w-names">曾嘉慧 ♥ 陆峰浩</p>
              <p class="seal-sub">卡通欢乐岛 · 等你登岛</p>
            </div>
          </article>
        </section>
      </main>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
